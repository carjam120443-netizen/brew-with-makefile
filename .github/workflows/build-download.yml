name: Build Windows Download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'brew.ps1'
      - 'Makefile'
      - 'install.ps1'
      - 'install.cmd'
      - 'Formula/**'
      - 'tests/**'
      - '.github/workflows/build-download.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU Make
        shell: pwsh
        run: |
          choco install make -y --no-progress
          $make = Get-Command make -ErrorAction Stop
          Write-Host "Using make at $($make.Source)"
          make --version

      - name: Build
        shell: pwsh
        run: make build

      - name: Validate formula JSON
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Formula -Filter '*.json')
          if ($files.Count -eq 0) { throw 'No formulas found' }
          foreach ($file in $files) {
            $f = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($field in @('name','version','description','url','sha256','binaries')) {
              if ($null -eq $f.$field -or ([string]$f.$field).Trim() -eq '') { throw "Invalid formula: $($file.Name) is missing $field" }
            }
            if ($f.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw "Invalid SHA-256 in $($file.Name)" }
            Write-Host "Validated $($f.name) $($f.version)"
          }

      - name: Test
        shell: pwsh
        run: make test

      - name: Test CLI and installer
        shell: pwsh
        run: |
          $help = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\brew.ps1 help | Out-String
          if ($help -notmatch 'brew setup') { throw 'CLI help test failed' }
          $search = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\brew.ps1 search | Out-String
          foreach ($name in @('7zip','fastfetch','ripgrep')) { if ($search -notmatch $name) { throw "Formula missing from search: $name" } }
          if (!(Test-Path .\install.ps1)) { throw 'install.ps1 missing' }
          if (!(Test-Path .\install.cmd)) { throw 'install.cmd missing' }

          $testHome = Join-Path $env:RUNNER_TEMP 'brew-test-home'
          if (Test-Path $testHome) { Remove-Item $testHome -Recurse -Force }
          New-Item -ItemType Directory -Force $testHome | Out-Null
          $env:BREW_PREFIX = Join-Path $testHome '.brew-with-makefile'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if (!(Test-Path (Join-Path $env:BREW_PREFIX 'bin\brew.cmd'))) { throw 'Installer did not create brew.cmd' }
          if (!(Test-Path (Join-Path $env:BREW_PREFIX 'Formula\fastfetch.json'))) { throw 'Installer did not copy formulas' }
          $installedSearch = powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:BREW_PREFIX 'bin\brew.ps1') search | Out-String
          if ($installedSearch -notmatch 'fastfetch') { throw 'Installed brew cannot find formulas' }

      - name: Create portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'brew-with-makefile'
          $out = Join-Path $env:GITHUB_WORKSPACE 'brew-with-makefile-windows.zip'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item brew.ps1 $stage
          Copy-Item Makefile $stage
          Copy-Item install.ps1 $stage
          Copy-Item install.cmd $stage
          Copy-Item README.md $stage
          Copy-Item Formula (Join-Path $stage 'Formula') -Recurse
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $out -Force
          Get-Item $out

      - name: Upload working download
        uses: actions/upload-artifact@v4
        with:
          name: brew-with-makefile-windows
          path: brew-with-makefile-windows.zip
          if-no-files-found: error
          retention-days: 30
